# Novixa WorkOS — Nginx Reverse Proxy Configuration
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Upstreams
    upstream nuxt_frontend {
        server web:3000;
        keepalive 32;
    }

    upstream laravel_api {
        server api:9000;
        keepalive 32;
    }

    # HTTP redirect to HTTPS (in prod) or single server
    server {
        listen 80;
        server_name localhost _;
        client_max_body_size 50M;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Laravel Static Storage
        location ^~ /storage/ {
            alias /var/www/html/storage/app/public/;
            access_log off;
            expires 30d;
        }

        # Laravel API & Sanctum Endpoints
        location ~ ^/(api|sanctum) {
            root /var/www/html/public;
            try_files $uri $uri/ /index.php?$query_string;

            location ~ \.php$ {
                include fastcgi_params;
                fastcgi_pass laravel_api;
                fastcgi_index index.php;
                fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
                fastcgi_param HTTP_PROXY "";
                fastcgi_buffer_size 128k;
                fastcgi_buffers 4 256k;
                fastcgi_busy_buffers_size 256k;
                fastcgi_read_timeout 60s;
            }
        }

        # Nuxt 4 SSR / Static Frontend
        location / {
            proxy_pass http://nuxt_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
