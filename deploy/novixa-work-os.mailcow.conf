# ==============================================================================
# novixa-work-os.novixa.dev — site block for mailcow's nginx on the Novixa VPS.
# MANAGED BY CI: installed by `sudo workos-sync-site` (nginx -t first, auto-restore).
# Edit it in the repository (deploy/novixa-work-os.mailcow.conf), not on the server.
# ==============================================================================

server {
    listen 80;
    server_name novixa-work-os.novixa.dev;
    return 301 https://novixa-work-os.novixa.dev$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name novixa-work-os.novixa.dev;

    # Cloudflare Origin Certificate (*.novixa.dev) — this site's own copy.
    ssl_certificate     /etc/nginx/conf.d/novixa-work-os/origin.pem;
    ssl_certificate_key /etc/nginx/conf.d/novixa-work-os/origin.key;

    # Real visitor IP, believed only from Cloudflare's published ranges.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

        # Resolved per request through Docker's DNS: if the app is down this site answers 502
    # instead of preventing mailcow's nginx from starting.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $workos_web http://novixa-work-os-web:8080;

    client_max_body_size 26m;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;

    location / {
        proxy_pass $workos_web;
    }
}
